version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # these move in lockstep; separate PRs for each would only create conflicts
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      junit:
        patterns:
          - "org.junit*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
    ignore:
      # the engine depends on a fork published under this groupId, not on upstream releases
      - dependency-name: "io.github.jam01:sjsonnet_3"
      # jackson is a floor the host application overrides, so routine bumps only force versions on
      # them. Listing the three version-update types leaves security updates open: a CVE still gets
      # a PR, at the minimum patched version
      - dependency-name: "com.fasterxml.jackson*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # camel-xtrasonnet compiles against 4.4.5 deliberately: the component supports every camel
      # release from that floor up, and bumping the floor would shrink that range. Security
      # updates stay open here too
      - dependency-name: "org.apache.camel*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/playground"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
